server.port=8080
spring.application.name=cadence-api

# ── Database (file-based H2, survives restarts) ─────────────────────
spring.datasource.url=jdbc:h2:file:./data/cadence;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ── H2 web console (http://localhost:8080/h2-console) ───────────────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── App info ─────────────────────────────────────────────────────────
app.version=1.0.0

# ── Security ─────────────────────────────────────────────────────────
# enabled=false : API is open, only /api/admin/** requires an ADMIN JWT.
# enabled=true  : every /api/** endpoint requires a valid JWT.
app.security.enabled=false
app.security.admin-username=admin
app.security.admin-password=admin-change-me
# HS256 secret - MUST be at least 32 chars. Override in production!
app.security.jwt-secret=cadence-dev-only-jwt-secret-change-me-please-32chars-minimum!!
app.security.jwt-ttl-hours=12

# ── Audit log cap ────────────────────────────────────────────────────
app.audit.max-entries=500

logging.level.root=INFO